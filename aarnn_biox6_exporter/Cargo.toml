[package]
name = "aarnn-biox6-exporter"
version = "0.1.0"
edition = "2021"
description = "Reference exporter from an AARNN physical snapshot to a calibrated CELLINK BIO X6 print plan"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
