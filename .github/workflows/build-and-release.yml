name: Unified CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release from the selected v* tag ref"
        required: false
        type: boolean
        default: false
      draft_release:
        description: "Mark a manually published release as draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark a manually published release as prerelease"
        required: false
        type: boolean
        default: false
      build_id:
        description: "Immutable container build ID to promote (defaults to current SHA)"
        required: false
      container_workload:
        description: "Container workload to promote"
        required: false
        type: choice
        options: [orchestrator, node, web-ui]
        default: node
      environment:
        description: "Container promotion target environment"
        required: false
        type: choice
        options: [developer, alpha, beta, canary, test, pre-prod, prod, release, ui]
      track:
        description: "Container promotion release track"
        required: false
        type: choice
        options: [shadow, canary, blue, green]
      cargo_features:
        description: "Cargo features to build for container images"
        required: false
        default: "all-features"
      run_version_bump:
        description: "Run automated Cargo version bump and tagging"
        required: false
        type: boolean
        default: false
      bump_type:
        description: "Version component to bump"
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch
      branch:
        description: "Branch to bump and tag (defaults to triggering ref branch)"
        required: false
        default: ""
      sync_wiki:
        description: "Sync .github/wiki/Home.md to the GitHub wiki"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep every JavaScript action on the Node 24 runtime, including actions
  # whose metadata still declares an older runtime during the transition.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_FEATURES: all-features
  CARGO_BUILD_TARGETS: aarnn_rust web_ui
  REGISTRY: ghcr.io
  IMAGE_NAME: neuralmimicry/aarnn_rust
  UBUNTU_NATIVE_BUILD_DEPS: >-
    ca-certificates curl xz-utils build-essential pkg-config libssl-dev protobuf-compiler
    dpkg-dev clang libclang-dev cmake git perl python3 libnl-3-dev
    libnl-route-3-dev libudev-dev
    ocl-icd-opencl-dev libopenmpi-dev libopencv-dev libgtk-3-dev libasound2-dev
    libv4l-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev
    libxrender-dev libice-dev libsm-dev libxcursor-dev libxi-dev
    libxrandr-dev libxcomposite-dev libxdamage-dev libxfixes-dev
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev
    libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    libfontconfig1-dev libfreetype6-dev

concurrency:
  group: unified-ci-cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify (${{ matrix.runner_arch }})
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.run_version_bump && !inputs.sync_wiki && inputs.environment == '')
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: X64
            runs_on: '"ubuntu-24.04"'
          - runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
    defaults:
      run:
        working-directory: repo-build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: false
          path: repo-build-release

      - name: Use large runner-backed temporary directory
        shell: bash
        run: |
          set -euo pipefail
          rust_tmp="${RUNNER_TEMP}/rust-tmp"
          mkdir -p "${rust_tmp}"
          echo "TMPDIR=${rust_tmp}" >> "${GITHUB_ENV}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt_update_retry() {
            local attempts="${1:-6}"
            local attempt=1
            while true; do
              if sudo apt-get \
                -o Acquire::ForceIPv4=true \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update; then
                return 0
              fi
              if (( attempt >= attempts )); then
                return 1
              fi
              sleep_for=$((attempt * 5))
              echo "apt-get update failed (attempt ${attempt}/${attempts}); retrying in ${sleep_for}s"
              sleep "${sleep_for}"
              attempt=$((attempt + 1))
            done
          }
          apt_install_retry() {
            local attempts="${1:-4}"
            shift
            local attempt=1
            while true; do
              if apt_update_retry 6 && sudo apt-get \
                -y \
                --no-install-recommends \
                --allow-downgrades \
                -o Acquire::ForceIPv4=true \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install "$@"; then
                return 0
              fi
              if (( attempt >= attempts )); then
                return 1
              fi
              sleep_for=$((attempt * 5))
              echo "apt-get install failed (attempt ${attempt}/${attempts}); retrying in ${sleep_for}s"
              sleep "${sleep_for}"
              attempt=$((attempt + 1))
            done
          }
          # shellcheck disable=SC2086
          apt_install_retry 4 $UBUNTU_NATIVE_BUILD_DEPS

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "repo-build-release -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Enforce Gail image tag policy
        run: bash scripts/check_gail_image_tags.sh .

      - name: Check build
        run: cargo check --locked --all-features --all-targets

      - name: Run tests
        env:
          NM_DISABLE_OPENCL: "1"
        # `--all-targets` takes precedence over `--lib` and makes Cargo build
        # test harnesses for every example and benchmark. Those targets are
        # already compiled by the preceding `cargo check`; linking all of them
        # kept the ARM64 linker silent for over 30 minutes before cancellation.
        # The CLI binary re-declares the library modules, so its test harness
        # only duplicates the library suite. Keep library, web UI and
        # integration tests; every target remains compile-checked above.
        run: >-
          cargo test --locked --all-features
          --lib
          --bin web_ui
          --test '*'

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin aarnn_rust --bin web_ui

      - name: Smoke test CLI help
        run: cargo run --locked --release --all-features --bin aarnn_rust -- --help

      - name: Smoke test web UI help
        run: cargo run --locked --release --all-features --bin web_ui -- --help

      - name: Validate release script
        run: bash -n scripts/package-release.sh

  release-meta:
    name: Release Metadata
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: repo-build-release
    outputs:
      artifact_version: ${{ steps.meta.outputs.artifact_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: false
          path: repo-build-release

      - name: Compute artifact metadata
        id: meta
        shell: bash
        env:
          MANUAL_PUBLISH_REQUEST: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          short_sha="${GITHUB_SHA:0:7}"
          release_tag=""
          publish_release="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            artifact_version="${release_tag#v}"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              publish_release="true"
            elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && \
                    "${MANUAL_PUBLISH_REQUEST}" == "true" ]]; then
              publish_release="true"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/heads/* ]]; then
            # Keep a rolling GitHub Release containing the artifacts from the
            # latest completely successful branch push.  This is deliberately
            # separate from immutable v* releases, but uses the same package
            # jobs and therefore cannot publish until every package succeeds.
            release_tag="latest"
            artifact_version="${cargo_version}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            publish_release="true"
          else
            artifact_version="${cargo_version}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
          fi

          # Only immutable v* releases must match Cargo.toml exactly. The
          # rolling latest release intentionally carries a run/commit-qualified
          # development package version.
          if [[ "$release_tag" == v* && "$artifact_version" != "$cargo_version" ]]; then
            echo "::error::Tag ${release_tag} does not match Cargo.toml"
            echo "::error::version ${cargo_version}"
            exit 1
          fi

          {
            echo "release_tag=$release_tag"
            echo "artifact_version=$artifact_version"
            echo "publish_release=$publish_release"
          } >> "$GITHUB_OUTPUT"

  package-linux:
    name: Package Linux (${{ matrix.ubuntu_label }} ${{ matrix.deb_arch }})
    needs:
      - verify
      - release-meta
    if: needs.verify.result == 'success' && needs.release-meta.result == 'success'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # qc01 provides the ARM64 runner. Serialize packaging jobs so two
      # ARM64 rootless Podman containers cannot contend for the same host
      # keyring quota; each job still receives isolated storage below.
      max-parallel: 1
      matrix:
        include:
          - runner_arch: X64
            runs_on: '"ubuntu-24.04"'
            ubuntu_series: "24.04"
            ubuntu_label: ubuntu24.04
            rust_target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            deb_arch: amd64
            container_platform: amd64
          - runner_arch: X64
            runs_on: '"ubuntu-24.04"'
            ubuntu_series: "25.04"
            ubuntu_label: ubuntu25.04
            rust_target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            deb_arch: amd64
            container_platform: amd64
          - runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            ubuntu_series: "24.04"
            ubuntu_label: ubuntu24.04
            rust_target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            deb_arch: arm64
            container_platform: arm64
          - runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            ubuntu_series: "25.04"
            ubuntu_label: ubuntu25.04
            rust_target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            deb_arch: arm64
            container_platform: arm64
    defaults:
      run:
        working-directory: repo-build-release
    env:
      # These are portable defaults; the next step moves them to RUNNER_TEMP
      # after GitHub has populated the runner context.
      PACKAGE_OUTPUT_DIR: /tmp/release-assets/${{ matrix.platform }}-${{ matrix.ubuntu_label }}
      CARGO_TARGET_DIR: /tmp/cargo-target/${{ matrix.platform }}-${{ matrix.ubuntu_label }}
      CONTAINER_CARGO_HOME: /tmp/cargo-home/${{ matrix.platform }}-${{ matrix.ubuntu_label }}
      CONTAINER_RUSTUP_HOME: /tmp/rustup-home/${{ matrix.platform }}-${{ matrix.ubuntu_label }}
      UBUNTU_CONTAINER_IMAGE: ubuntu:${{ matrix.ubuntu_series }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: false
          path: repo-build-release

      - name: Move package artifacts to runner temp storage
        shell: bash
        run: |
          set -euo pipefail
          echo "PACKAGE_OUTPUT_DIR=${RUNNER_TEMP}/release-assets-${{ matrix.platform }}-${{ matrix.ubuntu_label }}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target-${{ matrix.platform }}-${{ matrix.ubuntu_label }}" >> "${GITHUB_ENV}"
          echo "CONTAINER_CARGO_HOME=${RUNNER_TEMP}/cargo-home-${{ matrix.platform }}-${{ matrix.ubuntu_label }}" >> "${GITHUB_ENV}"
          echo "CONTAINER_RUSTUP_HOME=${RUNNER_TEMP}/rustup-home-${{ matrix.platform }}-${{ matrix.ubuntu_label }}" >> "${GITHUB_ENV}"

      - name: Verify Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y runc
          fi
          command -v podman >/dev/null 2>&1 || {
            echo "podman is required on the build runner."
            exit 1
          }
          command -v runc >/dev/null 2>&1 || {
            echo "runc is required on the build runner."
            exit 1
          }
          podman --version
          runc --version

      - name: Configure rootless podman runtime environment
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          conf_dir="${HOME}/.config/containers"
          mkdir -p "${conf_dir}"

          runtime_dir="/run/user/${uid}"
          if [[ ! -d "${runtime_dir}" ]] || [[ ! -w "${runtime_dir}" ]]; then
            runtime_dir="/tmp/podman-run-${uid}"
            mkdir -p "${runtime_dir}/containers"
            chmod 0700 "${runtime_dir}"
            echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
            rm -rf "${HOME}/.local/share/containers/storage" 2>/dev/null || true
            echo "Redirected XDG_RUNTIME_DIR -> ${runtime_dir}"
          fi

          # A self-hosted ARM64 runner may receive multiple packaging matrix
          # jobs over its lifetime. Keep each job's rootless Podman storage
          # and runtime namespace isolated so stale layers/keyrings from one
          # job cannot exhaust the next job's per-user quotas.
          storage_suffix="$(basename "${PACKAGE_OUTPUT_DIR}")"
          job_storage_root="${RUNNER_TEMP}/podman-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${storage_suffix}"
          job_run_root="${runtime_dir}/containers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${storage_suffix}"
          mkdir -p "${job_storage_root}" "${job_run_root}"
          chmod 0700 "${job_storage_root}" "${job_run_root}"

          printf '[storage]\ndriver = "overlay"\nrunroot = "%s"\ngraphroot = "%s"\n' \
            "${job_run_root}" "${job_storage_root}" > "${conf_dir}/storage.conf"
          echo "CONTAINERS_STORAGE_CONF=${conf_dir}/storage.conf" >> "${GITHUB_ENV}"

          # Hosted Ubuntu runners currently ship a crun build that can fail
          # before the first container starts with "unknown version
          # specified". Prefer runc when available and retain crun as the
          # fallback used by ARM self-hosted runners.
          if command -v runc >/dev/null 2>&1; then
            oci_runtime="runc"
          elif command -v crun >/dev/null 2>&1; then
            oci_runtime="crun"
          else
            echo "Neither crun nor runc found on PATH." >&2
            exit 1
          fi

          printf '[engine]\nruntime = "%s"\ncgroup_manager = "cgroupfs"\n' "${oci_runtime}" > "${conf_dir}/containers.conf"
          echo "CONTAINERS_CONF=${conf_dir}/containers.conf" >> "${GITHUB_ENV}"

          export XDG_RUNTIME_DIR="${runtime_dir}"
          export CONTAINERS_STORAGE_CONF="${conf_dir}/storage.conf"
          export CONTAINERS_CONF="${conf_dir}/containers.conf"

          if ! podman info >/dev/null 2>&1; then
            echo "Detected stale Podman state; running podman system migrate."
            podman system migrate
          fi
          podman info >/dev/null

      - name: Prepare packaging directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_OUTPUT_DIR"
          mkdir -p \
            "$PACKAGE_OUTPUT_DIR" \
            "$CARGO_TARGET_DIR" \
            "$CONTAINER_CARGO_HOME" \
            "$CONTAINER_RUSTUP_HOME"

      - name: Package Linux release artifacts
        shell: bash
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/podman-anonymous-auth.json"
          printf '{}\n' > "$authfile"
          # qc00 also hosts Gail training/inference workloads. Keep the
          # containerized release build bounded so concurrent workloads
          # cannot OOM-kill rustc (exit 137).
          podman run --rm -i --pull=missing \
            --authfile "$authfile" \
            --platform "linux/${{ matrix.container_platform }}" \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e CARGO_TARGET_DIR=/target \
            -e CARGO_BUILD_JOBS=1 \
            -e CARGO_INCREMENTAL=0 \
            -e UBUNTU_NATIVE_BUILD_DEPS="$UBUNTU_NATIVE_BUILD_DEPS" \
            -v "$PWD:/workspace:ro" \
            -v "$PACKAGE_OUTPUT_DIR:/out" \
            -v "$CARGO_TARGET_DIR:/target" \
            -v "$CONTAINER_CARGO_HOME:/cargo" \
            -v "$CONTAINER_RUSTUP_HOME:/rustup" \
            -w /workspace \
            "$UBUNTU_CONTAINER_IMAGE" \
            bash -s -- \
              "${{ matrix.rust_target }}" \
              "${{ needs.release-meta.outputs.artifact_version }}" \
              "${{ matrix.platform }}" \
              "${{ matrix.ubuntu_label }}" \
              "${{ matrix.deb_arch }}" \
              "${{ env.CARGO_FEATURES }}" \
              "${{ env.CARGO_BUILD_TARGETS }}" <<'SCRIPT'
          set -euo pipefail

          rust_target="$1"
          artifact_version="$2"
          platform="$3"
          artifact_suffix="$4"
          deb_arch="$5"
          cargo_features="$6"
          cargo_build_targets="$7"

          . /workspace/scripts/apt_retry.sh
          export AARNN_APT_UPDATE_ATTEMPTS=8
          export AARNN_APT_INSTALL_ATTEMPTS=5
          export AARNN_APT_RETRY_DELAY_SEC=8
          export AARNN_APT_FETCH_RETRIES=8
          export AARNN_APT_HTTP_TIMEOUT_SEC=45
          export AARNN_APT_REQUIRED_BINS="cc"
          # shellcheck disable=SC2086
          aarnn_apt_install_with_retry -y --no-install-recommends --allow-downgrades $UBUNTU_NATIVE_BUILD_DEPS

          . /workspace/scripts/ensure_container_rustup.sh "$rust_target"

          bash /workspace/scripts/package-release.sh \
            --version "$artifact_version" \
            --output-dir /out \
            --target-triple "$rust_target" \
            --platform "$platform" \
            --artifact-suffix "$artifact_suffix" \
            --deb-arch "$deb_arch" \
            --cargo-features "$cargo_features" \
            --cargo-build-targets "$cargo_build_targets"
          SCRIPT

      - name: Validate Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/podman-anonymous-auth.json"
          printf '{}\n' > "$authfile"
          podman run --rm -i --pull=missing \
            --authfile "$authfile" \
            --platform "linux/${{ matrix.container_platform }}" \
            -e EXPECTED_VERSION="${{ needs.release-meta.outputs.artifact_version }}" \
            -e EXPECTED_SUFFIX="${{ matrix.ubuntu_label }}" \
            -e EXPECTED_ARCH="${{ matrix.deb_arch }}" \
            -v "$PACKAGE_OUTPUT_DIR:/packages:ro" \
            "$UBUNTU_CONTAINER_IMAGE" \
            bash -s -- <<'SCRIPT'
          set -euo pipefail

          deb_path="$(find /packages -maxdepth 1 -type f -name "aarnn-rust_*_${EXPECTED_SUFFIX}_${EXPECTED_ARCH}.deb" | head -n 1)"
          if [[ -z "$deb_path" ]]; then
            echo "::error::Expected a Debian package under /packages"
            exit 1
          fi

          expected_version="$(
            printf '%s' "$EXPECTED_VERSION" \
              | tr '-' '~' \
              | sed -E 's/[^A-Za-z0-9.+:~]+/./g; s/^[^A-Za-z0-9]+//; s/[^A-Za-z0-9]+$//'
          )"
          actual_package="$(dpkg-deb -f "$deb_path" Package)"
          actual_version="$(dpkg-deb -f "$deb_path" Version)"
          actual_arch="$(dpkg-deb -f "$deb_path" Architecture)"

          [[ "$actual_package" == "aarnn-rust" ]]
          [[ "$actual_version" == "$expected_version" ]]
          [[ "$actual_arch" == "$EXPECTED_ARCH" ]]
          SCRIPT

      - name: Smoke install Debian package
        shell: bash
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/podman-anonymous-auth.json"
          printf '{}\n' > "$authfile"
          podman run --rm -i --pull=missing \
            --authfile "$authfile" \
            --platform "linux/${{ matrix.container_platform }}" \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e EXPECTED_SUFFIX="${{ matrix.ubuntu_label }}" \
            -e EXPECTED_ARCH="${{ matrix.deb_arch }}" \
            -v "$PACKAGE_OUTPUT_DIR:/packages:ro" \
            -v "$PWD/scripts:/tmp/scripts:ro" \
            "$UBUNTU_CONTAINER_IMAGE" \
            bash -s -- <<'SCRIPT'
          set -euo pipefail

          . /tmp/scripts/apt_retry.sh
          export AARNN_APT_UPDATE_ATTEMPTS=8
          export AARNN_APT_INSTALL_ATTEMPTS=5
          export AARNN_APT_RETRY_DELAY_SEC=8
          export AARNN_APT_FETCH_RETRIES=8
          export AARNN_APT_HTTP_TIMEOUT_SEC=45
          deb_path="$(find /packages -maxdepth 1 -type f -name "aarnn-rust_*_${EXPECTED_SUFFIX}_${EXPECTED_ARCH}.deb" | head -n 1)"
          deb_path="$(readlink -f "$deb_path")"

          aarnn_apt_install_with_retry -y --allow-downgrades "$deb_path"

          test -x /usr/bin/aarnn_rust
          test -x /usr/bin/web_ui
          test -f /usr/share/aarnn-rust/config.json
          aarnn_rust --help >/dev/null
          web_ui --help >/dev/null
          dpkg-query -W -f='${Version}\n' aarnn-rust
          SCRIPT

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.ubuntu_label }}
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e "$GITHUB_WORKSPACE/repo-build-release" ]]; then
            chown -R 1000:1000 "$GITHUB_WORKSPACE/repo-build-release"
          fi

  publish-release:
    name: Publish Release
    needs:
      - release-meta
      - package-linux
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      needs.release-meta.outputs.publish_release == 'true' &&
      needs.package-linux.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Validate publish target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ needs.release-meta.outputs.release_tag }}" ]]; then
            echo "::error::Publishing requires a resolved release tag"
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.release_tag }}
          DRAFT_RELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
          MANUAL_PRERELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0 | sort -z)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No packaged artifacts were downloaded"
            exit 1
          fi

          title="AARNN Rust ${RELEASE_TAG}"
          prerelease="${MANUAL_PRERELEASE}"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${RELEASE_TAG}" == *-* ]]; then
            prerelease="true"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "${RELEASE_TAG}" == "latest" ]]; then
              # The rolling release must contain only the newest successful
              # package set and must point at the commit that produced it.
              gh release edit "${RELEASE_TAG}" \
                --target "${GITHUB_SHA}" \
                --title "${title}" \
                --prerelease=false
              # Deleting a large accumulated rolling release serially can make
              # the runner appear frozen for tens of minutes.  Keep the
              # cleanup bounded and fail the job if any deletion fails.
              asset_delete_parallelism="${RELEASE_ASSET_DELETE_PARALLELISM:-8}"
              if [[ ! "${asset_delete_parallelism}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::RELEASE_ASSET_DELETE_PARALLELISM must be a positive integer"
                exit 1
              fi
              mapfile -t old_assets < <(
                gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name'
              )
              if [[ ${#old_assets[@]} -gt 0 ]]; then
                printf '%s\0' "${old_assets[@]}" |
                  xargs -0 -r -n1 -P "${asset_delete_parallelism}" \
                    bash -c 'set -euo pipefail; gh release delete-asset "$1" "$2" --yes' \
                    _ "${RELEASE_TAG}"
              fi
            fi
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
            exit 0
          fi

          args=(
            "${RELEASE_TAG}"
            "${files[@]}"
            --target "${GITHUB_SHA}"
            --title "${title}"
            --generate-notes
          )

          if [[ "${DRAFT_RELEASE}" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "${RELEASE_TAG}" == "latest" ]]; then
            # Make /releases/latest resolve to this rolling successful build.
            prerelease="false"
          elif [[ "${prerelease}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

  container-build:
    name: Container Build (${{ matrix.workload }}, ${{ matrix.arch }}, ${{ matrix.runner_arch }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - workload: orchestrator
            arch: amd64
            runner_arch: X64
            runs_on: '"ubuntu-24.04"'
            variant: amd64
            page_size: 4k
          - workload: orchestrator
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-4k
            page_size: 4k
          - workload: orchestrator
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-64k-hwe
            page_size: 64k-hwe
          - workload: node
            arch: amd64
            runner_arch: X64
            runs_on: '"ubuntu-24.04"'
            variant: amd64
            page_size: 4k
          - workload: node
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-4k
            page_size: 4k
          - workload: node
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-64k-hwe
            page_size: 64k-hwe
          - workload: web-ui
            arch: amd64
            runner_arch: X64
            runs_on: '"ubuntu-24.04"'
            variant: amd64
            page_size: 4k
          - workload: web-ui
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-4k
            page_size: 4k
          - workload: web-ui
            arch: arm64
            runner_arch: ARM64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            variant: arm64-64k-hwe
            page_size: 64k-hwe
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: repo-build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: false
          path: repo-build-release

      - name: Ensure 64K HWE NVIDIA host package when required
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.page_size }}" == "64k-hwe" ]]; then
            source scripts/ensure_64k_hwe_nvidia.sh
            aarnn_ensure_64k_hwe_nvidia true
          fi

      - name: Enforce Gail image tag policy
        run: bash scripts/check_gail_image_tags.sh .

      - name: Verify Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y runc
          fi
          command -v podman >/dev/null 2>&1 || {
            echo "podman is required on the build runner."
            exit 1
          }
          command -v runc >/dev/null 2>&1 || {
            echo "runc is required on the build runner."
            exit 1
          }
          podman --version
          runc --version

      - name: Configure rootless podman runtime environment
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          conf_dir="${HOME}/.config/containers"
          mkdir -p "${conf_dir}"
          runtime_dir="/run/user/${uid}"
          if [[ ! -d "${runtime_dir}" ]] || [[ ! -w "${runtime_dir}" ]]; then
            runtime_dir="/tmp/podman-run-${uid}"
            mkdir -p "${runtime_dir}/containers"
            chmod 0700 "${runtime_dir}"
            echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
            rm -rf "${HOME}/.local/share/containers/storage" 2>/dev/null || true
            echo "Redirected XDG_RUNTIME_DIR -> ${runtime_dir}"
          fi
          printf '[storage]\ndriver = "overlay"\nrunroot = "%s/containers"\ngraphroot = "%s/.local/share/containers/storage"\n' \
            "${runtime_dir}" "${HOME}" > "${conf_dir}/storage.conf"
          echo "CONTAINERS_STORAGE_CONF=${conf_dir}/storage.conf" >> "${GITHUB_ENV}"

          if command -v runc >/dev/null 2>&1; then
            oci_runtime="runc"
          elif command -v crun >/dev/null 2>&1; then
            oci_runtime="crun"
          else
            echo "Neither crun nor runc found on PATH." >&2
            exit 1
          fi
          printf '[engine]\nruntime = "%s"\ncgroup_manager = "cgroupfs"\n' "${oci_runtime}" > "${conf_dir}/containers.conf"
          echo "CONTAINERS_CONF=${conf_dir}/containers.conf" >> "${GITHUB_ENV}"

          export XDG_RUNTIME_DIR="${runtime_dir}"
          export CONTAINERS_STORAGE_CONF="${conf_dir}/storage.conf"
          export CONTAINERS_CONF="${conf_dir}/containers.conf"

          if ! podman info >/dev/null 2>&1; then
            echo "Detected stale Podman state; running podman system migrate."
            podman system migrate
          fi
          podman info >/dev/null

      - name: Verify runner architecture matches matrix
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          case "${host_arch}" in
            x86_64) host_target_arch="amd64" ;;
            aarch64|arm64) host_target_arch="arm64" ;;
            *)
              echo "Unsupported host architecture: ${host_arch}"
              exit 1
              ;;
          esac
          if [[ "${host_target_arch}" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture mismatch: host=${host_target_arch}, matrix=${{ matrix.arch }}"
            exit 1
          fi

      - name: Log in to GHCR
        env:
          # The package predates repository linkage and is private, so the
          # repository-scoped GITHUB_TOKEN cannot publish to it. Use the
          # dedicated package publisher token until the package is linked.
          GH_TOKEN: ${{ secrets.X_GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.X_GITHUB_USERNAME }}
        run: |
          printf '%s' "${GH_TOKEN}" | podman login \
            "${{ env.REGISTRY }}" \
            --username "${GHCR_USERNAME}" \
            --password-stdin

      - name: Derive immutable build id
        id: buildmeta
        run: echo "build_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare Debian package for container build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh scripts/prepare_container_package.sh
          ./scripts/prepare_container_package.sh \
            --workload "${{ matrix.workload }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir ./dist/container \
            --cache-dir ./.container-cache/debs-ci \
            --force \
            --cargo-features "${{ github.event_name == 'workflow_dispatch' && inputs.cargo_features || env.CARGO_FEATURES }}" \
            --cargo-build-targets "aarnn_rust web_ui"

      - name: Smoke install container Debian package in Ubuntu 24.04
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --pull=missing \
            --platform "linux/${{ matrix.arch }}" \
            --network host \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/dist/container:/tmp/aarnn:ro" \
            -v "$PWD/scripts:/tmp/scripts:ro" \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              . /tmp/scripts/apt_retry.sh
              export AARNN_APT_UPDATE_ATTEMPTS=8
              export AARNN_APT_INSTALL_ATTEMPTS=5
              export AARNN_APT_RETRY_DELAY_SEC=8
              arch="$(dpkg --print-architecture)"
              deb="$(find /tmp/aarnn -maxdepth 1 -type f -name "aarnn-rust_*_${arch}.deb" | head -n 1)"
              test -n "$deb"
              aarnn_apt_install_with_retry -y --no-install-recommends "$deb"
              test -x /usr/bin/aarnn_rust
            '

      - name: Build and push architecture image
        env:
          GH_TOKEN: ${{ secrets.X_GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.X_GITHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build_id="${{ steps.buildmeta.outputs.build_id }}"
          arch_tag="${image}:${build_id}-${{ matrix.workload }}-${{ matrix.variant }}"

          build_args=(
            --file ./Containerfile
            --platform "linux/${{ matrix.arch }}"
            --network host
            --tag "${arch_tag}"
            --build-arg "CONTAINER_WORKLOAD=${{ matrix.workload }}"
            --build-arg "CARGO_FEATURES=${{ github.event_name == 'workflow_dispatch' && inputs.cargo_features || env.CARGO_FEATURES }}"
            --build-arg "PYTHON_MIN_VERSION=3.12"
            --build-arg "PYTHON_FULL_VERSION=3.12.2"
            --build-arg "TARGET_PAGE_SIZE=${{ matrix.page_size }}"
            .
          )

          set +e
          podman build "${build_args[@]}"
          build_rc=$?
          set -e

          if [[ "${build_rc}" -ne 0 ]]; then
            echo "Initial podman build failed (exit=${build_rc})."
            echo "Attempting one clean-cache rebuild (podman builder/image prune + --no-cache)."
            podman builder prune -f || true
            podman image prune -f || true
            podman build --no-cache "${build_args[@]}"
          fi

          # GHCR can return 403 for cross-tag blob-reuse checks even after a
          # successful login.  A stable, distinct gzip profile avoids that
          # registry probe while remaining compatible with standard runtimes.
          push_args=(
            --force-compression
            --compression-format gzip
            --compression-level 1
          )
          push_attempt=1
          while ! podman push "${push_args[@]}" "${arch_tag}"; do
            if [[ "${push_attempt}" -ge 4 ]]; then
              echo "::error::GHCR push failed after ${push_attempt} attempts"
              exit 1
            fi
            push_attempt=$((push_attempt + 1))
            echo "GHCR push failed; refreshing package publisher credentials before retry ${push_attempt}/4"
            printf '%s' "${GH_TOKEN}" |
              podman login "${{ env.REGISTRY }}" \
                --username "${GHCR_USERNAME}" \
                --password-stdin
            sleep $((push_attempt * 5))
          done

  container-manifest:
    name: Container Manifest (${{ matrix.workload }})
    if: github.event_name == 'push'
    needs: container-build
    strategy:
      max-parallel: 1
      matrix:
        workload: [orchestrator, node, web-ui]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Verify Podman is available
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y runc
          fi
          command -v podman >/dev/null 2>&1 || {
            echo "podman is required on the build runner."
            exit 1
          }
          command -v runc >/dev/null 2>&1 || {
            echo "runc is required on the build runner."
            exit 1
          }
          podman --version
          runc --version

      - name: Configure rootless podman runtime environment
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          conf_dir="${HOME}/.config/containers"
          mkdir -p "${conf_dir}"
          runtime_dir="/run/user/${uid}"
          if [[ ! -d "${runtime_dir}" ]] || [[ ! -w "${runtime_dir}" ]]; then
            runtime_dir="/tmp/podman-run-${uid}"
            mkdir -p "${runtime_dir}/containers"
            chmod 0700 "${runtime_dir}"
            echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
            rm -rf "${HOME}/.local/share/containers/storage" 2>/dev/null || true
            echo "Redirected XDG_RUNTIME_DIR -> ${runtime_dir}"
          fi
          printf '[storage]\ndriver = "overlay"\nrunroot = "%s/containers"\ngraphroot = "%s/.local/share/containers/storage"\n' \
            "${runtime_dir}" "${HOME}" > "${conf_dir}/storage.conf"
          echo "CONTAINERS_STORAGE_CONF=${conf_dir}/storage.conf" >> "${GITHUB_ENV}"
          if command -v runc >/dev/null 2>&1; then
            oci_runtime="runc"
          elif command -v crun >/dev/null 2>&1; then
            oci_runtime="crun"
          else
            echo "Neither crun nor runc found on PATH." >&2
            exit 1
          fi
          printf '[engine]\nruntime = "%s"\ncgroup_manager = "cgroupfs"\n' "${oci_runtime}" > "${conf_dir}/containers.conf"
          echo "CONTAINERS_CONF=${conf_dir}/containers.conf" >> "${GITHUB_ENV}"

          export XDG_RUNTIME_DIR="${runtime_dir}"
          export CONTAINERS_STORAGE_CONF="${conf_dir}/storage.conf"
          export CONTAINERS_CONF="${conf_dir}/containers.conf"

          if ! podman info >/dev/null 2>&1; then
            echo "Detected stale Podman state; running podman system migrate."
            podman system migrate
          fi
          podman info >/dev/null

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.X_GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.X_GITHUB_USERNAME }}
        run: |
          printf '%s' "${GH_TOKEN}" | podman login \
            "${{ env.REGISTRY }}" \
            --username "${GHCR_USERNAME}" \
            --password-stdin

      - name: Assemble multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build="${GITHUB_SHA}"
          manifest="${image}:${build}-${{ matrix.workload }}"
          podman manifest rm "${manifest}" >/dev/null 2>&1 || true
          podman image rm -f "${manifest}" >/dev/null 2>&1 || true
          podman manifest create "${manifest}"
          podman manifest add "${manifest}" "docker://${image}:${build}-${{ matrix.workload }}-amd64"
          podman manifest add "${manifest}" "docker://${image}:${build}-${{ matrix.workload }}-arm64-4k"
          podman manifest push --all "${manifest}" "docker://${manifest}"

      - name: Publish branch alias for developer flow
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build="${GITHUB_SHA}"
          branch_tag="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          branch_manifest="${image}:${branch_tag}-${{ matrix.workload }}"
          podman manifest rm "${branch_manifest}" >/dev/null 2>&1 || true
          podman image rm -f "${branch_manifest}" >/dev/null 2>&1 || true
          podman manifest create "${branch_manifest}"
          podman manifest add "${branch_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-amd64"
          podman manifest add "${branch_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-arm64-4k"
          podman manifest push --all "${branch_manifest}" "docker://${branch_manifest}"

          # Keep the deployment-facing alias aligned with the newest fully
          # successful push.  The manifest job runs only after every
          # architecture image build has succeeded.
          latest_manifest="${image}:latest-${{ matrix.workload }}"
          podman manifest rm "${latest_manifest}" >/dev/null 2>&1 || true
          podman image rm -f "${latest_manifest}" >/dev/null 2>&1 || true
          podman manifest create "${latest_manifest}"
          podman manifest add "${latest_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-amd64"
          podman manifest add "${latest_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-arm64-4k"
          podman manifest push --all "${latest_manifest}" "docker://${latest_manifest}"

      - name: Publish version and latest tags on release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build="${GITHUB_SHA}"
          version_tag="${GITHUB_REF_NAME}"
          version_manifest="${image}:${version_tag}-${{ matrix.workload }}"
          podman manifest rm "${version_manifest}" >/dev/null 2>&1 || true
          podman image rm -f "${version_manifest}" >/dev/null 2>&1 || true
          podman manifest create "${version_manifest}"
          podman manifest add "${version_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-amd64"
          podman manifest add "${version_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-arm64-4k"
          podman manifest push --all "${version_manifest}" "docker://${version_manifest}"

          latest_manifest="${image}:latest-${{ matrix.workload }}"
          podman manifest rm "${latest_manifest}" >/dev/null 2>&1 || true
          podman image rm -f "${latest_manifest}" >/dev/null 2>&1 || true
          podman manifest create "${latest_manifest}"
          podman manifest add "${latest_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-amd64"
          podman manifest add "${latest_manifest}" "docker://${image}:${build}-${{ matrix.workload }}-arm64-4k"
          podman manifest push --all "${latest_manifest}" "docker://${latest_manifest}"
          echo "Published ${image}:${version_tag} and ${image}:latest"

      - name: Verify published manifests include amd64 and arm64
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build="${GITHUB_SHA}"

          verify_ref() {
            local ref="$1"
            local platform="$2"
            echo "Verifying ${ref} for ${platform}"
            podman pull --quiet --platform "${platform}" "docker://${ref}" >/dev/null
          }

          manifest="${image}:${build}-${{ matrix.workload }}"
          verify_ref "${manifest}" "linux/amd64"
          verify_ref "${manifest}" "linux/arm64"

          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            branch_tag="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
            verify_ref "${image}:${branch_tag}-${{ matrix.workload }}" "linux/amd64"
            verify_ref "${image}:${branch_tag}-${{ matrix.workload }}" "linux/arm64"
            verify_ref "${image}:latest-${{ matrix.workload }}" "linux/amd64"
            verify_ref "${image}:latest-${{ matrix.workload }}" "linux/arm64"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            verify_ref "${image}:${GITHUB_REF_NAME}-${{ matrix.workload }}" "linux/amd64"
            verify_ref "${image}:${GITHUB_REF_NAME}-${{ matrix.workload }}" "linux/arm64"
            verify_ref "${image}:latest-${{ matrix.workload }}" "linux/amd64"
            verify_ref "${image}:latest-${{ matrix.workload }}" "linux/arm64"
          fi

  container-promote:
    name: Container Promote
    if: github.event_name == 'workflow_dispatch' && inputs.environment != ''
    runs-on: [self-hosted, Linux, X64]
