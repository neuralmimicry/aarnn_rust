          podman manifest rm "${target}" >/dev/null 2>&1 || true
          podman image rm -f "${target}" >/dev/null 2>&1 || true
          podman manifest create "${target}"
          podman manifest add --all "${target}" "docker://${image}:${build}-${workload}"
          podman manifest push --all "${target}" "docker://${target}"
          echo "Promoted ${image}:${build}-${workload} -> ${target}"

  version-bump:
    name: Version Bump and Tag
    if: github.event_name == 'workflow_dispatch' && inputs.run_version_bump
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: repo-build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.X_GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}
          path: repo-build-release

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          bump="${{ inputs.bump_type || 'patch' }}"
          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"
          {
            echo "current=$current"
            echo "next=$next"
            echo "tag=v${next}"
          } >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $next ($bump)"

      - name: Check tag does not already exist
        shell: bash
        run: |
          if git ls-remote --tags origin "${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.ver.outputs.tag }} already exists — skipping bump."
            exit 1
          fi

      - name: Update Cargo.toml version
        shell: bash
        run: |
          sed -i \
            's/^version = "${{ steps.ver.outputs.current }}"$/version = "${{ steps.ver.outputs.next }}"/' \
            Cargo.toml

      - name: Update Cargo.lock version entry
        shell: bash
        run: |
          sed -i \
            '/^name = "aarnn_rust"$/{n;s/^version = "${{ steps.ver.outputs.current }}"$/version = "${{ steps.ver.outputs.next }}"/}' \
            Cargo.lock

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          toml_ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          lock_ver="$(awk '/^name = "aarnn_rust"$/{getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit}' Cargo.lock)"
          if [[ "$toml_ver" != "${{ steps.ver.outputs.next }}" ]]; then
            echo "::error::Cargo.toml version is '$toml_ver', expected '${{ steps.ver.outputs.next }}'"
            exit 1
          fi
          if [[ "$lock_ver" != "${{ steps.ver.outputs.next }}" ]]; then
            echo "::error::Cargo.lock version is '$lock_ver', expected '${{ steps.ver.outputs.next }}'"
            exit 1
          fi

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version ${{ steps.ver.outputs.current }} -> ${{ steps.ver.outputs.next }}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.ver.outputs.tag }}"
          git tag -f latest
          git push origin HEAD:"${GITHUB_REF_NAME}" "${{ steps.ver.outputs.tag }}"
          git push origin -f refs/tags/latest

  sync-wiki:
    name: Sync Wiki
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.sync_wiki)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Push wiki Home page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ ! -f "${GITHUB_WORKSPACE}/.github/wiki/Home.md" ]; then
            echo "No .github/wiki/Home.md found; skipping wiki sync."
            exit 0
          fi
          wiki_dir=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" "${wiki_dir}" 2>/dev/null || true
          cd "${wiki_dir}"
          if [ ! -d .git ]; then
            git init -b master
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git"
          fi
          cp "${GITHUB_WORKSPACE}/.github/wiki/Home.md" Home.md
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Home.md
          git diff --cached --quiet && echo "No changes to wiki" && exit 0
          git commit -m "docs: update wiki Home page"
          git push -u origin HEAD:master 2>&1 || git push -u origin HEAD:main 2>&1
          echo "Wiki updated successfully"
