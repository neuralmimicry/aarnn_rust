      - name: Promote immutable build
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          build="${{ inputs.build_id || github.sha }}"
          workload="${{ inputs.container_workload || 'node' }}"
