name: Minecraft adapter contract
on:
  pull_request:
    paths: ['sim/minecraft/**', 'sim/content/**', 'scripts/sim_content.py', 'scripts/minecraft.py', 'scripts/bedrock*.py', 'scripts/*minecraft*.py', 'scripts/run_sim.sh', 'scripts/qa/*minecraft*', 'scripts/qa/*bedrock*', 'web_ui/webgl-world.js', 'webots_world/configs/**', '.github/workflows/minecraft.yml']
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
      - run: cargo xtask qa run --suite simulator-minecraft
      - run: cargo xtask qa run --suite simulator-minecraft-bedrock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-contract
          path: |
            target/qa/minecraft/
            sim/minecraft/build/libs/
