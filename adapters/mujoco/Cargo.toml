[package]
name = "aarnn-mujoco"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native = ["dep:bindgen", "dep:signal-hook"]
viewer = ["native", "dep:libloading"]
service = ["native", "dep:axum", "dep:tokio"]

[dependencies]
aarnn-embodiment = { path = "../../crates/aarnn-embodiment" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
signal-hook = { version = "0.3", optional = true }
libloading = { version = "=0.8.9", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }

[build-dependencies]
bindgen = { version = "=0.73.2", optional = true }

[[bin]]
name = "aarnn-mujoco"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "aarnn-physics-service"
path = "src/service.rs"
required-features = ["service"]
