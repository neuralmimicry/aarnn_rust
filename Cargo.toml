[package]
name = "aarnn_rust"
version = "0.1.27"
edition = "2024"

[workspace]
members = [".", "tools/xtask"]
default-members = ["."]
resolver = "2"

[dependencies]
ndarray = { version = "0.17", features = ["blas", "rayon"] }
ndarray-rand = "0.16"
rand = { version = "0.10", features = ["thread_rng"] }
rand_distr = "0.6"
jni = { version = "0.21", optional = true }
clap = { version = "4.6", features = ["derive"] }
plotters = { version = "0.3", optional = true }
plotters-svg = { version = "0.3", optional = true }
plotters-bitmap = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = "2.0"
anyhow = "1.0"
aarnn-biox6-exporter = { path = "aarnn_biox6_exporter" }
fastrand = "2"
rayon = { version = "1.12", optional = true }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
argon2 = "0.5"
openidconnect = { version = "4", features = ["reqwest"] }
reqwest = { version = "0.13", features = ["blocking", "cookies", "json"] }
fs2 = "0.4"
hex = "0.4"
sha2 = "0.10"
jsonwebtoken = { version = "10.1", default-features = false, features = ["rust_crypto", "use_pem"] }
time = "0.3"
opencl3 = { version = ">=0.12.3", optional = true }
cudarc = { version = ">=0.19.3", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12000"] }
num_cpus = { version = "1.17", optional = true }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
proc-macro2 = { version = "1.0", optional = true }
bindgen = { version = ">=0.72.1", optional = true }
cmake = { version = "0.1", optional = true }
sysinfo = { version = "0.38", optional = true }
core_affinity = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
image = { version = "0.25", optional = true }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native"] }
ibverbs = { version = "0.9", optional = true }
mpi = { version = ">=0.8.1", optional = true }

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"

[dependencies.eframe]
version = "0.34"
optional = true
default-features = true
features = ["default", "wgpu"]

[dependencies.egui]
version = "0.34"
optional = true

[dependencies.rfd]
version = "0.17"
optional = true

[dependencies.cpal]
version = "0.17"
optional = true

[dependencies.symphonia]
version = "0.5"
optional = true
features = ["aac", "mp3", "flac", "vorbis", "wav"]

[dependencies.rustfft]
version = "6.4"
optional = true

[features]
default = ["parallel", "sysinfo", "viz"]

# Host-only batch visualisation. Android and other portable profiles do not
# pull desktop font/rendering dependencies into the native library.
viz = ["dep:plotters", "dep:plotters-svg", "dep:plotters-bitmap"]

# Enable the interactive UI and audio providers via optional dependencies
# Use "dep:" to activate optional deps as features
sysinfo = ["dep:sysinfo"]
tracing = ["dep:tracing"]
ui = [
    "dep:eframe",
    "dep:egui",
    "dep:rfd",
    "dep:cpal",
    "dep:symphonia",
    "dep:rustfft",
    # serde and serde_json are always available
    "sysinfo",
]

# Development-only native framebuffer capture for UI evidence. The eframe
# feature is inert unless NM_UI_CAPTURE_TO is explicitly supplied. Set
# NM_UI_CAPTURE_CLOSE=0 to keep the UI/runtime alive after the one-shot save.
ui_screenshot = ["ui", "robot_io", "dep:image"]

# Experimental: enable 3D spatial growth of the hidden topology
growth3d = []

# Experimental: neuron morphology data structures and AARNN extras
morpho = []

# Engine runtime capabilities shared by standalone, orchestrator, node, and
# web_ui workloads. The explicit parallel/sysinfo entries let container builds
# use `--no-default-features` while still getting the expected runtime profile.
engine_runtime = [
    "parallel",
    "sysinfo",
    "opencl",
    "obs",
    "shmem",
    "growth3d",
    "morpho",
]

# Workload aliases used by the role-specific container builds.
standalone_workload = ["engine_runtime"]
orchestrator_workload = ["engine_runtime"]
node_workload = ["engine_runtime"]
stable_runtime_workload = ["engine_runtime", "stable_executor_live", "management_v1"]
web_ui_workload = ["engine_runtime"]
desktop_ui_workload = [
    "engine_runtime",
    "ui",
    "image_input",
    "robot_io",
]

# Distributed-emulator migration gates. The reference contracts are always
# compilable for tests; runtime adoption remains explicitly opt-in until each
# phase's production integration gate is completed.
superdense_executor = []
virtual_partitioning = ["superdense_executor"]
causal_transport = ["virtual_partitioning"]
multi_brain_scheduler = ["causal_transport"]
replicated_durability = ["multi_brain_scheduler"]
# Feature-gated live adapter for the stable-ID shard executor.  It is kept
# separate from replicated_durability so the reference durable Runner path
# remains the default rollback profile until stable topology/placement and
# network-authority gates are complete.
stable_executor_live = ["replicated_durability"]
management_v1 = ["replicated_durability"]
workstation_io = ["management_v1"]

# Android JNI entry points. Native packaging is performed by the Android
# Gradle build into generated output; no ABI library is checked into source.
mobile_android = ["dep:jni", "parallel"]

# Backward-compatible alias for the previous broad container feature set.
container = ["desktop_ui_workload"]

# Enable CPU data-parallelism with Rayon
parallel = [
    "dep:rayon",
    "dep:core_affinity",
]
core_affinity = ["dep:core_affinity"]

# Enable GPU acceleration with OpenCL
opencl = [
    "dep:opencl3",
]

# Enable CUDA acceleration backend (used as fallback when OpenCL GPU is unavailable)
cuda = [
    "dep:cudarc",
]

# Optional: observability (timings/logs)
obs = [
    "dep:tracing",
]

# Optional input sources
image_input = [
    "ui",
    "dep:image",
]

video_input = [
    "ui",
    "dep:opencv",
]

webcam_input = [
    "ui",
    "dep:nokhwa",
]

# Optional: generic robot IO bridge (e.g., Webots adapters)
robot_io = []

# In-process C ABI for low-latency Webots integration
# Implies UI (Runner) and robot_io (mapping/adapters); also needs serde/json for init schema
ffi_bridge = [
    "ui",
    "robot_io",
]

# Experimental: shared-memory ring buffer for cross-process ultra-low-latency IO
shmem = [
    "dep:memmap2",
]

# Enable RDMA support
rdma = [
    "dep:ibverbs",
    "dep:proc-macro2",
    "dep:bindgen",
    "dep:cmake",
]

# Enable OpenMPI-based distributed bootstrap and rank orchestration helpers
openmpi = [
    "dep:mpi",
]

[lib]
name = "aarnn_rust"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies.memmap2]
version = "0.9"
optional = true

[target.'cfg(not(target_arch = "aarch64"))'.dependencies.opencv]
version = "0.98"
optional = true
default-features = false
features = [
    "clang-runtime",
    "videoio",
]

[patch.crates-io]
ibverbs-sys = { path = "third_party/ibverbs-sys" }
mpi-sys = { path = "third_party/mpi-sys" }
