buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath "net.fabricmc:fabric-loom:${loom_version}" }
}
if (project.findProperty('no_remap') == 'true') {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}
version = project.mod_version
group = 'org.neuralmimicry'
// Keep jars from incompatible Minecraft APIs distinct in build/libs and in
// staged installations. Building one profile must never overwrite another.
base { archivesName = "aarnn-minecraft-${minecraft_version}" }
repositories { mavenCentral() }
def minecraftSourceProfile = project.findProperty('minecraft_version') == '26.2' ? '26.2' : '1.21.1'
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
sourceSets.main.java.srcDir("src/${minecraftSourceProfile}/java")
loom {
    splitEnvironmentSourceSets()
    mods {
        aarnn { sourceSet sourceSets.main; sourceSet sourceSets.client }
        aarnn_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gameTest {
            server()
            name 'Minecraft habitat tests'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
            runDir 'build/gametest'
            source sourceSets.gametest
        }
    }
}
afterEvaluate { sourceSets.client.java.srcDir("src/${minecraftSourceProfile}/client") }
sourceSets {
    visualtest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}
loom {
    mods { aarnn_visualtest { sourceSet sourceSets.visualtest } }
    runs {
        visualTest {
            client()
            source sourceSets.visualtest
            runDir 'build/visual'
            programArgs '--quickPlaySingleplayer', 'AARNN-Sensory-Lab', '--width', '1280', '--height', '960'
        }
    }
}
tasks.register('worldPack', JavaExec) {
    dependsOn gametestClasses
    classpath = sourceSets.gametest.runtimeClasspath
    mainClass = 'org.neuralmimicry.minecraft.WorldPack'
}
tasks.register('prepareVisualWorld', Sync) {
    from { zipTree(layout.buildDirectory.file('distributions/AARNN-Sensory-Lab.zip')) }
    into layout.buildDirectory.dir('visual/saves')
}
tasks.named('runVisualTest') { dependsOn 'prepareVisualWorld' }
tasks.named('runGameTest') {
    doFirst { delete layout.buildDirectory.file('gametest/clean-exit.json') }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (project.findProperty('no_remap') != 'true') {
        mappings loom.officialMojangMappings()
    }
    def fabricConfiguration = project.findProperty('no_remap') == 'true' ? 'implementation' : 'modImplementation'
    add(fabricConfiguration, "net.fabricmc:fabric-loader:${loader_version}")
    add(fabricConfiguration, "net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
configurations { bridgeLibraries }
dependencies { bridgeLibraries 'com.google.code.gson:gson:2.10.1' }
tasks.register('bridgeJar', Jar) {
    dependsOn classes
    archiveClassifier = 'bridge'
    manifest { attributes 'Main-Class': 'org.neuralmimicry.minecraft.BridgeMain' }
    from(sourceSets.main.output) {
        include 'org/neuralmimicry/minecraft/BridgeMain*.class'
        include 'org/neuralmimicry/minecraft/Content*.class'
        include 'org/neuralmimicry/minecraft/AerCodec*.class'
        include 'aarnn/content.generated.json'
    }
    from({ configurations.bridgeLibraries.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'module-info.class'
    }
    from('LICENSE', 'NOTICE.md')
    from('licenses') { into 'licenses' }
}
build.dependsOn bridgeJar
java {
    toolchain { languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.findProperty('java_release') ?: '21')) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.findProperty('java_release') ?: '21')
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'loader_version', loader_version
    inputs.property 'java_release', java_release
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: minecraft_version,
            loader_version: loader_version, java_release: java_release
    }
}
test {
    dependsOn 'referenceFixtures'
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('referenceFixtures', Exec) {
    workingDir '../..'
    commandLine 'node', 'scripts/qa/minecraft_oracle.cjs'
}
jar { from('LICENSE', 'NOTICE.md') }
